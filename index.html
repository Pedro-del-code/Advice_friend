<title>???</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    font-family: 'Courier New', monospace;
  }
  #screen {
    position: fixed; inset: 0; background: #000;
    display: flex; align-items: center; justify-content: center;
  }
  #playBtn {
    padding: 18px 48px; font-size: 22px; letter-spacing: 4px;
    background: transparent; color: #eee; border: 2px solid #eee;
    cursor: pointer; border-radius: 6px; transition: all .2s;
  }
  #playBtn:hover { background: #eee; color: #000; }

  #jumpscare {
    position: fixed; inset: 0; background: #000;
    display: none; align-items: center; justify-content: center;
    z-index: 10;
  }
  #jumpscare img {
    position: absolute; width: 100%; height: 100%; object-fit: cover;
    opacity: 0;
  }
  .flash {
    animation: flashPop 0.18s steps(1) forwards;
  }
  @keyframes flashPop {
    0%   { opacity: 1; transform: scale(1.4); }
    100% { opacity: 1; transform: scale(1.0); }
  }
  body.shake { animation: shakeIt 0.4s linear infinite; }
  @keyframes shakeIt {
    0% { transform: translate(0,0); }
    25% { transform: translate(-12px, 8px); }
    50% { transform: translate(10px, -10px); }
    75% { transform: translate(-8px, -6px); }
    100% { transform: translate(0,0); }
  }
  #ytPlayer { position: fixed; top: -9999px; left: -9999px; }
</style>

<!-- Player oculto do YouTube (YouTube IFrame Player API oficial) -->
<div id="ytPlayer"></div>

<script>
  // ======= CONFIGURAÇÃO DO SOM (YouTube IFrame API) =======
  // Troque o ID abaixo pelo ID do vídeo do YouTube que contém o som
  // desejado (ex.: o efeito/trilha do FRIEND / "advice_friend" do Deltarune).
  // O ID é o trecho depois de "v=" na URL do YouTube.
  const YOUTUBE_VIDEO_ID = "UfC98GBdBME";

  let player;
  let ytReady = false;
  let pendingPlay = false; // true se o usuário clicou antes da API estar pronta

  // Carrega a API do YouTube dinamicamente
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.body.appendChild(tag);

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('ytPlayer', {
      height: '0',
      width: '0',
      videoId: YOUTUBE_VIDEO_ID,
      playerVars: {
        'autoplay': 0,
        'controls': 0,
        'disablekb': 1,
        'loop': 1,
        'playlist': YOUTUBE_VIDEO_ID // necessário para o loop funcionar
      },
      events: {
        'onReady': () => {
          ytReady = true;
          // Se o usuário já tinha clicado em Play antes da API carregar,
          // dispara a reprodução agora.
          if (pendingPlay) {
            player.playVideo();
          }
        },
        'onStateChange': onPlayerStateChange,
        'onError': (e) => {
          // Códigos comuns: 101/150 = incorporação desativada pelo dono do vídeo
          console.error('Erro no player do YouTube. Código:', e.data);
          if (e.data === 101 || e.data === 150) {
            console.error('Esse vídeo não permite ser incorporado em outros sites. Escolha outro ID.');
          }
        }
      }
    });
  }

  // Garante o loop mesmo se o parâmetro 'loop' falhar
  function onPlayerStateChange(event) {
    if (event.data === YT.PlayerState.ENDED) {
      player.seekTo(0);
      player.playVideo();
    }
  }

  // ======= LÓGICA DO JUMPSCARE =======
  const playBtn = document.getElementById('playBtn');
  const screenEl = document.getElementById('screen');
  const jumpscareEl = document.getElementById('jumpscare');
  const img1 = document.getElementById('img1');
  const img2 = document.getElementById('img2');

  playBtn.addEventListener('click', () => {
    // inicia o som em loop
    if (ytReady && player && player.playVideo) {
      player.playVideo();
      player.unMute();
      player.setVolume(100);
    } else {
      // API ainda não carregou: marca para tocar assim que estiver pronta
      pendingPlay = true;
    }

    screenEl.style.display = 'none';
    jumpscareEl.style.display = 'flex';

    // efeito de tremor na tela
    document.body.classList.add('shake');

    // pisca as duas imagens alternadamente pra dar o susto
    img1.classList.add('flash');
    setTimeout(() => {
      img1.style.opacity = '0';
      img2.classList.add('flash');
    }, 120);
    setTimeout(() => {
      img1.classList.add('flash');
      img2.style.opacity = '0';
    }, 240);
    setTimeout(() => {
      img2.classList.add('flash');
      img1.style.opacity = '0';
    }, 360);

    setTimeout(() => {
      document.body.classList.remove('shake');
    }, 900);
  });
</script>

</body>
</html>
